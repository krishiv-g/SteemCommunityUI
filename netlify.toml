[build]
  publish = "dist"
  command = "npm run build"

[[edge_functions]]
  path = "/"
  function = "og"

[[edge_functions]]
  path = "/post/*"
  function = "og"

[[edge_functions]]
  path = "/user/*"
  function = "og"

[[edge_functions]]
  path = "/community"
  function = "og"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
